<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Image AR</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-three.prod.js"
    }
  }
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: sans-serif;
    }

    #container {
      width: 100vw;
      height: 100dvh;
      position: relative;
    }

    #status {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      padding: 10px 16px;
      color: white;
      background: #222c;
      border-radius: 20px;
      font-size: 13px;
      white-space: nowrap;
      pointer-events: none;
    }

    #touchArea {
      position: fixed;
      inset: 0;
      z-index: 5;
      touch-action: none;
      background: transparent;
    }

    #startButton {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      padding: 16px 26px;
      border: 0;
      border-radius: 12px;
      background: white;
      color: #111;
      font-weight: bold;
      font-size: 17px;
      cursor: pointer;
    }

    #soundButton {
      display: none;
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 16;
      padding: 10px 18px;
      border: 0;
      border-radius: 20px;
      background: white;
      color: #222;
      font-size: 14px;
      font-weight: bold;
      touch-action: manipulation;
    }

    #controls {
      position: fixed;
      bottom: 25px;
      left: 0;
      right: 0;
      z-index: 15;
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    #controls button {
      padding: 10px 16px;
      border: 0;
      border-radius: 20px;
      background: #000;
      color: white;
      font-size: 13px;
      white-space: nowrap;
      touch-action: manipulation;
    }
  </style>
</head>

<body>

  <div id="container"></div>
  <div id="touchArea"></div>

  <div id="status">AR 준비 중...</div>

  <button id="startButton">카메라 시작</button>
  <button id="soundButton">소리 켜기</button>

  <div id="controls">
    <button id="reset">초기화</button>
  </div>
