<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Image AR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
    }
    #status {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      padding: 10px 16px;
      color: white;
      background: rgba(34, 34, 34, 0.85);
      border-radius: 20px;
      font-size: 13px;
      white-space: nowrap;
      pointer-events: none;
    }
    #soundButton {
      display: none;
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      padding: 10px 18px;
      border: 0;
      border-radius: 20px;
      background: white;
      color: #222;
      font-size: 14px;
      font-weight: bold;
    }
    #controls {
      position: fixed;
      bottom: 25px;
      left: 0;
      right: 0;
      z-index: 999;
      display: flex;
      justify-content: center;
      gap: 12px;
    }
    #controls button {
      padding: 10px 18px;
      border: 0;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      font-size: 13px;
    }
    .a-enter-vr { display: none !important; }
  </style>
</head>
